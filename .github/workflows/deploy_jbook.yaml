name: deploy-book

# Run this when the master or main branch changes
on:
  push:
    branches:
    - main
    # If your git repository has the Jupyter Book within some-subfolder next to
    # unrelated files, you can make this run only if a file within that specific
    # folder has been modified.
    #
    # paths:
    # - some-subfolder/**

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
  
    # Install dependencies
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip # Implicitly uses requirements.txt for cache key

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true  # Uses binary packages automatically

    - name: Cache R packages
      uses: actions/cache@v3
      with:
        path: ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}-v1
        restore-keys: |
          ${{ runner.os }}-r-
  
    - name: Install R packages
      run: |
        Rscript -e "install.packages(c('IRkernel', 'tidyverse'), Ncpus = 2)"
        
    # (optional) Cache your executed notebooks between runs
    # if you have config:
    # execute:
    #   execute_notebooks: cache
    - name: cache executed notebooks
      uses: actions/cache@v4
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    - name: Debug - Check files
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== All files ==="
        ls -laR
        echo "=== Checking logo file ==="
        ls -la images/EFI_Logo_Whitetext_transparent.png || echo "Logo not found"
        echo "=== File type check ==="
        file images/EFI_Logo_Whitetext_transparent.png || echo "Cannot check file type"
        
    - name: Clean build
      run: |
        rm -rf _build
    
    - name: Build the book
      run: |
        jupyter book build . 
        
    # Upload the book's HTML as an artifact
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_build/html"

    # Deploy the book's HTML to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
