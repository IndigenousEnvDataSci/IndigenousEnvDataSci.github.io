name: deploy-book

# Only build when files inside the book content change (adjust paths to match your repo)
on:
  push:
    branches:
      - main
    paths:
      - "_config.yml"
      - "toc.yml"
      - "**/*.ipynb"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_message:
        description: 'Deployment message'
        required: false
        default: 'Manual deployment'

concurrency:
  group: deploy-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    env:
      # Use a directory inside the workspace for cached R libraries
      R_LIBS_USER: ${{ github.workspace }}/Rlibs

    steps:
      - uses: actions/checkout@v4

      - name: Cache Python wheelhouse
        uses: actions/cache@v4
        with:
          path: .wheels
          key: wheelhouse-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            wheelhouse-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Cache jupyter-book executed notebooks
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-book-cache-${{ runner.os }}-${{ hashFiles('**/*.ipynb', 'content/**', 'docs/**', '_config.yml', 'toc.yml') }}
          restore-keys: |
            jupyter-book-cache-${{ runner.os }}-

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-${{ hashFiles('**/*.R', 'DESCRIPTION', 'requirements.R') }}
          restore-keys: |
            r-packages-${{ runner.os }}-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build wheelhouse (if needed)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          mkdir -p .wheels
          pip wheel --wheel-dir .wheels -r requirements.txt || true

      - name: Install dependencies from wheelhouse
        run: |
          if [ -d ".wheels" ] && [ "$(ls -A .wheels)" ]; then
            pip install --no-index --find-links .wheels -r requirements.txt
          else
            pip install -r requirements.txt --prefer-binary
          fi

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages (into R_LIBS_USER)
        shell: bash
        run: |
          mkdir -p "${R_LIBS_USER}"
          R -e "install.packages(c('IRkernel','tidyverse'), lib='${R_LIBS_USER}', repos='https://cloud.r-project.org')"
          R -e "IRkernel::installspec()"

      - name: Build the book
        run: |
          jupyter book build . 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
