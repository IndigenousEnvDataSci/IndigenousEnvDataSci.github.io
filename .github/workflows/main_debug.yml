name: deploy-book (debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_message:
        description: 'Deployment message'
        required: false
        default: 'Manual deployment'

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      # insert this before steps that run pip install / actions/setup-python / R package installs
    
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Show runner info & repo
        run: |
          echo "USER: $(whoami)"
          echo "PWD: $(pwd)"
          echo "GIT REF: $GITHUB_REF"
          echo "GITHUB_SHA: $GITHUB_SHA"
          ls -la

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Print environment (sorted)
        run: env | sort

      - name: Install dependencies
        run: |
          set -x
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # ensure jupyter-book present (safe to run even if in requirements)
          pip install jupyter-book sphinx myst-parser || true

      - name: Show versions
        run: |
          python --version
          pip --version
          jupyter-book --version || true
          python -c "import sphinx; print('sphinx', getattr(sphinx,'__version__','unknown'))"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install IRkernel
        run: |
          set -x
          R -e 'install.packages("IRkernel", repos="https://cloud.r-project.org")'
          R -e 'install.packages("tidyverse", dependencies = TRUE, repos="https://cloud.r-project.org")'
          R -e 'IRkernel::installspec()'

      - name: cache executed notebooks
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

      - name: Build the book (verbose, save log)
        # If your book sources are in a subfolder, uncomment and set working-directory:
        # working-directory: docs
        run: |
          set -x
          # run build and save stdout/stderr to build.log
          jupyter-book build . 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "jupyter-book exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "BUILD FAILED: dumping last 400 lines of build.log"
            tail -n 400 build.log || true
            exit $rc
          fi

      - name: Show produced files & find html output
        run: |
          echo "Top-level listing:"
          ls -la
          echo "Looking for any _build/html directories (maxdepth 6):"
          find . -type d -name "_build" -maxdepth 6 -print -exec sh -c 'echo "Contents of $0/html:"; ls -la "$0/html" || true' {} \; || true

      - name: Save build.log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyter-book-build-log
          path: build.log

      - name: Check build output exists
        id: check_build
        run: |
          TARGET="_build/html"
          if [ -d "$TARGET" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "$TARGET found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "$TARGET not found"
          fi

      - name: Upload artifact (only if build output exists)
        if: steps.check_build.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

      - name: Fail early with helpful message (if no build output)
        if: steps.check_build.outputs.exists == 'false'
        run: |
          echo "ERROR: _build/html not found. See the build log artifact and 'Show produced files' step output for diagnostics."
          echo "Printing repository tree (depth 3):"
          find . -maxdepth 3 -print -exec ls -la {} \; || true
          exit 1

      - name: Deploy to GitHub Pages
        if: steps.check_build.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
