# Debuggable Jupyter Book build + Pages deploy workflow
# Save as .github/workflows/deploy-book-debug.yml
name: deploy-book (debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_message:
        description: 'Deployment message'
        required: false
        default: 'Manual deployment'

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner & repo info
        run: |
          echo "USER: $(whoami)"
          echo "PWD: $(pwd)"
          echo "GIT REF: $GITHUB_REF"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "Top-level listing:"
          ls -la

      - name: Show repo tree (depth 4)
        run: |
          echo "Repository tree (depth 4):"
          find . -maxdepth 4 -print -exec ls -ld {} \; || true

      - name: Check _toc.yml file entries (detect directories/missing files)
        run: |
          python -m pip install pyyaml
          python - <<'PY'
import os, sys, yaml
toc = "_toc.yml"
if not os.path.exists(toc):
    print("_toc.yml not found in repo root")
    sys.exit(0)
data = yaml.safe_load(open(toc, encoding="utf-8"))
def collect(node):
    res=[]
    if isinstance(node, dict):
        for k,v in node.items():
            if k=="file" and isinstance(v,str):
                res.append(v)
            else:
                res += collect(v)
    elif isinstance(node, list):
        for item in node:
            res += collect(item)
    return res
files = collect(data)
if not files:
    print("No 'file' entries found in _toc.yml")
    sys.exit(0)
problems = []
print("Checking file entries from _toc.yml:")
for f in files:
    orig = f
    f = f.strip().strip('"').strip("'")
    candidates = [f, f+".md", f+".ipynb", os.path.join(f,"index.md"), os.path.join(f,"README.md")]
    found=False
    for c in candidates:
        if os.path.exists(c):
            kind = "dir" if os.path.isdir(c) else "file"
            print(f"  {orig} -> {c} ({kind})")
            if os.path.isdir(c):
                problems.append((orig, c, "directory"))
            found=True
            break
    if not found:
        print(f"  {orig} -> MISSING (tried: {', '.join(candidates)})")
        problems.append((orig, None, "missing"))
if problems:
    print("\nProblems detected with _toc.yml entries:")
    for orig, actual, kind in problems:
        if kind=="missing":
            print(f" - {orig} -> MISSING")
        else:
            print(f" - {orig} -> directory at {actual}")
    print("\nTip: For a folder-based chapter, reference the index file explicitly (e.g. 'MOD1/Mod1_pt1/index' or ensure index.md exists). Also check filename case.")
    sys.exit(2)
print("\nAll TOC file entries resolve to files (no directories detected).")
PY

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          set -x
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install jupyter-book sphinx myst-parser || true

      - name: Show versions
        run: |
          python --version
          pip --version
          jupyter-book --version || true
          python -c "import sphinx; print('sphinx', getattr(sphinx,'__version__','unknown'))"

      - name: Set up R (if you use R notebooks)
        uses: r-lib/actions/setup-r@v2

      - name: Install IRkernel (if you use R notebooks)
        run: |
          set -x
          R -e 'install.packages("IRkernel", repos="https://cloud.r-project.org")' || true
          R -e 'install.packages("tidyverse", dependencies = TRUE, repos="https://cloud.r-project.org")' || true
          R -e 'IRkernel::installspec()' || true

      - name: (Optional) Cache executed notebooks
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

      - name: Build the book (verbose, save log)
        run: |
          set -o pipefail
          echo "Running jupyter-book build ..."
          jupyter-book build . 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "jupyter-book exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "BUILD FAILED: showing last 400 lines of build.log"
            tail -n 400 build.log || true
            exit $rc
          fi

      - name: Show produced files & find html output
        run: |
          echo "Top-level listing:"
          ls -la
          echo "Looking for any _build/html directories (maxdepth 6):"
          find . -type d -name "_build" -maxdepth 6 -print -exec sh -c 'echo "Contents of $0/html:"; ls -la "$0/html" || true' {} \; || true

      - name: Upload build.log artifact
        uses: actions/upload-artifact@v4
        with:
          name: jupyter-book-build-log
          path: build.log

      - name: Check build output exists
        id: check_build
        run: |
          TARGET="_build/html"
          if [ -d "$TARGET" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found $TARGET"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "$TARGET not found"
          fi

      - name: Upload artifact (only if build output exists)
        if: steps.check_build.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

      - name: Fail with helpful message (if no build output)
        if: steps.check_build.outputs.exists == 'false'
        run: |
          echo "ERROR: _build/html not found. See the jupyter-book-build-log artifact and the 'Show produced files' step output for diagnostics."
          echo "Printing repository tree (depth 4):"
          find . -maxdepth 4 -print -exec ls -la {} \; || true
          exit 1

      - name: Deploy to GitHub Pages
        if: steps.check_build.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
