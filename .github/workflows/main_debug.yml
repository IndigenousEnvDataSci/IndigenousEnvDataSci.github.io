# debugging issues with main.yml 
name: deploy-book (debugging)

# Run this when the master or main branch changes
on:
  push:
    branches:
    - main
  
  # Manual deployment trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: choice
        options:
        - production
        - staging
      deploy_message:
        description: 'Deployment message'
        required: false
        default: 'Manual deployment'

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          pkg-config
    
    # Install dependencies
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    
    - name: Install Python dependencies
      run: pip install -r requirements.txt
    
    # Install R and IRkernel to run notebooks in R
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
    
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true  # Use pre-built binaries!

    - name: Cache R packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::IRkernel
          any::tidyverse
          any::textshaping

    - name: Install IRkernel for Jupyter
      run: R -e 'IRkernel::installspec()'

    - name: Test R kernel
      run: |
        echo "Testing R kernel..."
        R -e 'IRkernel::installspec(user = FALSE)'
        jupyter kernelspec list
    
    # Cache executed notebooks between runs
    - name: Cache executed notebooks
      uses: actions/cache@v4
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}
    
    # Build the book
    - name: Build the book
      run: |
        jupyter-book build .
    
    # Upload the book's HTML as an artifact
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_build/html"
    
    # Deploy the book's HTML to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
